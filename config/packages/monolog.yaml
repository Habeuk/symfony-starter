monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            # Dépréciations à part, rotation 7 jours
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                level: info
                max_files: 7
                channels: ["deprecation"]

            # Erreurs et warnings, rotation 7 jours
            errors:
                type: rotating_file
                path: "%kernel.logs_dir%/errors.log"
                level: error
                max_files: 7
                channels: ["!event", "!deprecation", "!doctrine", "!console"]

            # Log principal (tout le reste), rotation 7 jours
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 7
                channels: ["!event", "!deprecation", "!errors", "!doctrine", "!console"]

            # Console (commandes)
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # Handler pour les dépréciations uniquement
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                level: info
                max_files: 7
                channels: ["deprecation"]

            # Handler principal pour tout le reste (errors, warnings, etc.)
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/test.log"
                level: debug
                max_files: 7
                channels: ["!event", "!deprecation"]
when@prod:
    monolog:
        handlers:
            # Dépréciations à part, JSON, rotation 60 jours
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                level: info
                max_files: 60
                channels: ["deprecation"]
                formatter: monolog.formatter.json

            # Bufferisation : n'écrit que si erreur >= error
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                channels: ["!event", "!deprecation"]

            # Écriture réelle du buffer, rotation 60 jours
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/prod.log"
                level: debug
                max_files: 60
                formatter: monolog.formatter.json

            # Console (commandes)
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
