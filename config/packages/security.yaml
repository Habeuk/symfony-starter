security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # #############################################################
        # Firewall pour l'API login
        login_api:
            pattern: ^/api/(login_check|token/refresh)
            stateless: true
            # jwt: ~
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            refresh_jwt:
                check_path: /api/token/refresh
            # Verifie si le compte de l'utilisateur est activé'.'
            user_checker: Habeuk\HbkSymfony\Security\UserChecker
            # Pour le développement, on peut laisser sans authentification
            # security: false
        # protection de toutes les routes derriere l'API.
        ###############
        # authorise la recuperation du formulaire de d'inscription.
        register_form:
            pattern: ^/api/form-fields/UserAnonymousUser/create
            stateless: true
            security: false

        ###############
        # authorise la creation de compte
        register_api:
            pattern: ^/api/user/register
            stateless: true
            security: false

        # authorise la verification d'email
        verify_email_api:
            pattern: ^/api/verify/email
            stateless: true
            security: false

        # require le token pour toutes les autres routes.
        api:
            pattern: ^/api
            stateless: true
            jwt: ~
            # Verifie si le compte de l'utilisateur est activé'.'
            user_checker: Habeuk\HbkSymfony\Security\UserChecker
            # deconnexion.
            logout:
                path: api_token_invalidate

        # #############################################################
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout

            login_throttling:
                max_attempts: 3 # en prod 3 essaie.
                interval: '25 minutes'
                cache_pool: 'cache.rate_limiter'
            # Verifie si le compte de l'utilisateur est activé'.'
            user_checker: Habeuk\HbkSymfony\Security\UserChecker

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/api/user/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/form-fields/User/create, roles: PUBLIC_ACCESS }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: [ROLE_ADMIN] }
        - { path: ^/api, roles: [ROLE_USER] }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
